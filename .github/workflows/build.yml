name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "App Name"
        required: true
        default: "My App"
      website_url:
        description: "Website URL"
        required: true
        default: "https://example.com"
      logo_url:
        description: "Logo URL (direct link to PNG/JPG icon)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update app_name and website_url in strings.xml
        if: github.event_name == 'workflow_dispatch'
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEBSITE_URL="${{ github.event.inputs.website_url }}"
          
          # Escape special characters for sed
          ESCAPED_APP_NAME=$(echo "$APP_NAME" | sed 's/[\&/\]/\\&/g')
          ESCAPED_WEBSITE_URL=$(echo "$WEBSITE_URL" | sed 's/[\&/\]/\\&/g')

          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$ESCAPED_APP_NAME</string>|g" app/src/main/res/values/strings.xml
          sed -i "s|<string name="website_url">.*</string>|<string name="website_url">$ESCAPED_WEBSITE_URL</string>|g" app/src/main/res/values/strings.xml

      - name: Download and set app logo
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.logo_url != ''
        run: |
          LOGO_URL="${{ github.event.inputs.logo_url }}"

          # Install ImageMagick for image resizing
          sudo apt-get update && sudo apt-get install -y imagemagick

          # Download the logo image
          curl -L -o /tmp/logo_original.png "$LOGO_URL"

          # Resize and copy to each mipmap density directory
          declare -A sizes=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for dir in "${!sizes[@]}"; do
            size=${sizes[$dir]}
            mkdir -p "app/src/main/res/$dir"
            convert /tmp/logo_original.png -resize ${size}x${size} "app/src/main/res/$dir/ic_launcher.png"
            convert /tmp/logo_original.png -resize ${size}x${size} "app/src/main/res/$dir/ic_launcher_round.png"
          done

          # Also update drawable/logo.png for adaptive icon foreground
          mkdir -p app/src/main/res/drawable
          cp /tmp/logo_original.png app/src/main/res/drawable/logo.png

          echo "Logo downloaded and resized successfully"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk